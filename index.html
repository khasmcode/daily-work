<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការងារប្រចាំថ្ងៃ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Khim+Sonny&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <h1>ការងារប្រចាំថ្ងៃ</h1>
                <p>បញ្ចូលព័ត៌មានការងារប្រចាំថ្ងៃរបស់អ្នក</p>
            </div>
        </header>

        <section class="form-card">
            <form id="dailyWorkForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">
                            ឈ្មោះ <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="បញ្ចូលឈ្មោះ"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="responsibility">
                            ការងារ <span>*</span>
                        </label>

                        <textarea
                            id="responsibility"
                            name="responsibility"
                            rows="3"
                            placeholder="បញ្ចូលការងារដែលបានធ្វើ..."
                            required
                        ></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label for="other">
                            ផ្សេងៗ
                        </label>

                        <textarea
                            id="other"
                            name="other"
                            rows="3"
                            placeholder="បញ្ចូលព័ត៌មានផ្សេងៗ..."
                        ></textarea>
                    </div>

                </div>

                <div class="form-actions">
                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="addRow()"
                    >
                        <span>＋</span>
                        បន្ថែមជួរ
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary"
                    >
                        សម្អាត
                    </button>
                </div>
            </form>
        </section>

        <section class="table-card">
            <div class="table-header">
                <div>
                    <h2>បញ្ជីការងារប្រចាំថ្ងៃ</h2>
                    <p id="rowCount">ចំនួន 0 ជួរ</p>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th class="number-column">ល.រ</th>
                            <th>ឈ្មោះ</th>
                            <th>ការងារ</th>
                            <th>ផ្សេងៗ</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3>មិនទាន់មានទិន្នន័យ</h3>
                    <p>សូមបញ្ចូលព័ត៌មានខាងលើ ហើយចុច "បន្ថែមជួរ"</p>
                </div>
            </div>
        </section>


        <section class="download-actions">
            <button
                type="button"
                class="btn btn-success"
                onclick="downloadAsImage()"
            >
                ទាញយកជារូបភាព
            </button>

            <button
                type="button"
                class="btn btn-danger"
                onclick="downloadAsPDF()"
            >
                ទាញយកជា PDF
            </button>
        </section>
    </main>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
